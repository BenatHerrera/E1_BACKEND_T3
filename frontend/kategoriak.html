<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategoriak</title>
  <link rel="stylesheet" href="css/estiloak.css">
</head>
<body>
  <header id="nav" class="goiburua"></header>

  <main class="edukia">
    <form id="form" novalidate>
      <input type="hidden" id="id">
      <label for="izena">Izena</label>
      <input type="text" id="izena" maxlength="100" placeholder="Adib. Portatila" required>
      <p id="errorea" class="errorea" role="alert"></p>
      <button type="submit" id="gorde">Gehitu</button>
      <button type="button" id="utzi" class="bigarrena" hidden>Utzi</button>
    </form>

    <table>
      <thead><tr><th>ID</th><th>Izena</th><th>Ekintzak</th></tr></thead>
      <tbody id="taula"></tbody>
    </table>
  </main>

  <script type="module" src="js/kategoriak.js"></script>
</body>
</html>
